<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Catapult shot validation</title>
<style>body{font:14px system-ui;margin:0;background:#18212a;color:#eef;padding:16px}button{margin:0 8px 12px 0;padding:10px 14px;border:0;border-radius:8px;background:#e5a94f;color:#251b0e;font-weight:700}iframe{width:100%;height:78vh;border:1px solid #59646f;border-radius:10px;background:white}pre{white-space:pre-wrap;background:#0e151b;padding:12px;border-radius:8px;min-height:3em}</style>
<h1>Catapult shot validation</h1>
<button id="prepare">Prepare battle</button><button id="preview">Show 30% preview</button><button id="shot">Run complete shot</button><button id="cancel">Run early release</button><button id="pointercancel">Run pointer cancel</button><button id="exit">Run battle exit</button>
<pre id="result">Load the battle, then show the preview.</pre>
<iframe id="game" src="/cookie-roguelike-mockup.html?preview=1"></iframe>
<script>
const frame=document.querySelector('#game');
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function game(){return frame.contentWindow;}
document.querySelector('#prepare').onclick=async()=>{const p=game();p.setGameFullscreen=()=>Promise.resolve();p.playRoundIntro=()=>Promise.resolve();p.showScreen('battle');await wait(500);p.fitArenaWorld();document.querySelector('#result').textContent='Battle ready. Camera fit and preview controls are prepared.';};
document.querySelector('#preview').onclick=()=>{const p=game();const launcher=p.document.querySelector('#launchPad');p.aimState=p.createIdleAimState();p.aimState.phase='direction';p.aimState.angleDeg=52;p.aimState.powerPercent=76;p.aimState.targetX=launcher.offsetLeft+launcher.offsetWidth+420;p.aimState.hasSelectedDirection=true;p.drawTrajectoryPreview();const visible=p.document.querySelector('#trajectoryPath').getAttribute('d');const full=p.document.querySelector('#trajectoryGeometry').getAttribute('d');const check={visiblePath:visible,fullGeometry:full,visiblePathLength:p.document.querySelector('#trajectoryPath').getTotalLength(),fullPathLength:p.document.querySelector('#trajectoryGeometry').getTotalLength(),visibleStroke:getComputedStyle(p.document.querySelector('#trajectoryPath')).stroke};document.querySelector('#result').textContent=JSON.stringify(check,null,2);};
document.querySelector('#shot').onclick=async()=>{const p=game();const arena=p.document.querySelector('#arena');const rect=arena.getBoundingClientRect();const launcher=p.document.querySelector('#launchPad');p.aimState=p.createIdleAimState();p.aimState.phase='direction';p.aimState.angleDeg=52;p.aimState.powerPercent=76;p.aimState.targetX=launcher.offsetLeft+launcher.offsetWidth+420;p.aimState.hasSelectedDirection=true;p.aimState.pointerId=905;p.aimState.isPointerHeld=true;p.aimState.isPowerLocked=true;p.drawTrajectoryPreview();const ammoBefore=Number(p.document.querySelector('#ammoValue').textContent);const evt=new p.PointerEvent('pointerup',{bubbles:true,pointerId:905,pointerType:'mouse',button:0,clientX:rect.left+rect.width*.86,clientY:rect.top+rect.height*.48});const flightStarted=performance.now();const pending=p.onArenaPointerUp(evt);await wait(260);p.dispatchEvent(new Event('resize'));await wait(350);const flightProgress=Math.min(1,(performance.now()-flightStarted)/700);const geometry=p.document.querySelector('#trajectoryGeometry');const expectedPoint=geometry.getPointAtLength(geometry.getTotalLength()*flightProgress);const spriteTransform=p.document.querySelector('#projectileSprite').style.transform;const spriteCoordinates=spriteTransform.match(/translate3d\(([-0-9.]+)px,\s*([-0-9.]+)px,\s*0px\)/);const flightSample=spriteCoordinates?{progress:flightProgress,actual:{x:Number(spriteCoordinates[1])+12,y:Number(spriteCoordinates[2])+12},expected:{x:expectedPoint.x,y:expectedPoint.y}}:null;const during={spriteTransform,phase:p.aimState.phase,previewPath:p.document.querySelector('#trajectoryPath').getAttribute('d'),geometryPath:p.document.querySelector('#trajectoryGeometry').getAttribute('d'),spriteVisible:!p.document.querySelector('#projectileSprite').hidden,camera:getComputedStyle(p.document.querySelector('#arenaWorld')).transform,flightSample};await pending;for(let i=0;i<30;i++){const currentTransform=getComputedStyle(p.document.querySelector('#arenaWorld')).transform;const scale=Number(currentTransform.slice(7).split(',')[0]||1);if(scale<0.5)break;await wait(100);}const after={phase:p.aimState.phase,previewPath:p.document.querySelector('#trajectoryPath').getAttribute('d'),geometryPath:p.document.querySelector('#trajectoryGeometry').getAttribute('d'),spriteVisible:!p.document.querySelector('#projectileSprite').hidden,ammoBefore,ammoAfter:Number(p.document.querySelector('#ammoValue').textContent),camera:getComputedStyle(p.document.querySelector('#arenaWorld')).transform};document.querySelector('#result').textContent=JSON.stringify({during,after},null,2);};
document.querySelector('#cancel').onclick=async()=>{const p=game();const ammoBefore=Number(p.document.querySelector('#ammoValue').textContent);p.aimState=p.createIdleAimState();p.aimState.phase='angle';p.aimState.pointerId=906;p.aimState.isPointerHeld=true;p.cancelAim('early-release');await wait(150);const report={phase:p.aimState.phase,previewPath:p.document.querySelector('#trajectoryPath').getAttribute('d'),geometryPath:p.document.querySelector('#trajectoryGeometry').getAttribute('d'),spriteVisible:!p.document.querySelector('#projectileSprite').hidden,ammoBefore,ammoAfter:Number(p.document.querySelector('#ammoValue').textContent),camera:getComputedStyle(p.document.querySelector('#arenaWorld')).transform};document.querySelector('#result').textContent=JSON.stringify(report,null,2);};document.querySelector('#pointercancel').onclick=async()=>{const p=game();const ammoBefore=Number(p.document.querySelector('#ammoValue').textContent);p.aimState=p.createIdleAimState();p.aimState.phase='direction';p.aimState.pointerId=907;p.aimState.isPointerHeld=true;p.aimState.hasSelectedDirection=true;p.drawTrajectoryPreview();p.cancelAim('pointer-cancel');await wait(150);document.querySelector('#result').textContent=JSON.stringify({phase:p.aimState.phase,previewPath:p.document.querySelector('#trajectoryPath').getAttribute('d'),geometryPath:p.document.querySelector('#trajectoryGeometry').getAttribute('d'),spriteVisible:!p.document.querySelector('#projectileSprite').hidden,ammoBefore,ammoAfter:Number(p.document.querySelector('#ammoValue').textContent),camera:getComputedStyle(p.document.querySelector('#arenaWorld')).transform},null,2);};
document.querySelector('#exit').onclick=async()=>{const p=game();p.aimState=p.createIdleAimState();p.aimState.phase='launching';p.aimState.pointerId=908;p.aimState.isPointerHeld=false;p.focusAimCamera(true);p.showScreen('board');await wait(150);document.querySelector('#result').textContent=JSON.stringify({phase:p.aimState.phase,battleHidden:p.document.querySelector('[data-screen="battle"]').hidden,previewPath:p.document.querySelector('#trajectoryPath').getAttribute('d'),geometryPath:p.document.querySelector('#trajectoryGeometry').getAttribute('d'),spriteVisible:!p.document.querySelector('#projectileSprite').hidden,camera:getComputedStyle(p.document.querySelector('#arenaWorld')).transform},null,2);};</script></html>
