<!doctype html>
<html lang="ko"><meta charset="utf-8"><title>Forest parallax verification</title>
<style>body{margin:0;background:#f5f0e6;font:14px system-ui}nav{padding:10px;display:flex;gap:8px;flex-wrap:wrap}button{padding:8px}iframe{display:block;width:760px;height:900px;border:0}pre{white-space:pre-wrap;padding:10px;max-width:1000px;max-height:80px;overflow:auto}</style>
<nav><button onclick="runSuite()">Run camera checks</button><button onclick="view('enemy')">Enemy view</button><button onclick="view('launcher')">Launcher view</button><button onclick="view('fit')">Fit view</button><button onclick="resize(1440)">1440px</button><button onclick="resize(760)">760px</button><button onclick="resize(390)">390px</button><button onclick="shot()">Shot check</button><button onclick="fullscreen()">Fullscreen check</button><button onclick="watchHidden()">Watch actual visibility</button><button onclick="checkCoverage()">Check all scene sizes</button></nav>
<pre id="log">Waiting for the actual mockup page.</pre><iframe id="scene" allowfullscreen src="/cookie-roguelike-mockup.html" onload="page().showScreen('battle')"></iframe>
<script>
const checks=[];let busy=false;
function page(){return document.getElementById('scene').contentWindow}
function log(name,detail){checks.push({name,detail});document.getElementById('log').textContent=JSON.stringify(checks,null,2)}
function assert(name,condition,detail){if(!condition){log('FAIL '+name,detail);throw Error(name)}log('PASS '+name,detail)}
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function ready(){for(let i=0;i<100;i++){if(page().document.getElementById('arena').dataset.forestReady==='true')return;await pause(50)}throw Error('Forest assets did not load')}
function normalize(){const p=page();p.roundIntroId++;p.stopCameraAnimation();p.document.querySelectorAll('[data-screen]').forEach(s=>s.hidden=s.dataset.screen!=='battle');p.setArenaArea('forest');p.fitArenaWorld()}
function states(){const p=page(),d=p.document,w=d.getElementById('arenaWorld');return {camera:new p.DOMMatrixReadOnly(p.getComputedStyle(w).transform),layers:[...w.querySelectorAll('[data-forest-layer]')].map(e=>({name:e.dataset.forestLayer,p:Number(e.dataset.parallax),matrix:new p.DOMMatrixReadOnly(p.getComputedStyle(e).transform)}))}}
function identity(){return states().layers.every(l=>Math.abs(l.matrix.a-1)<0.0001&&Math.abs(l.matrix.e)<0.001&&Math.abs(l.matrix.f)<0.001)}
function refresh(target,scale){const p=page();p.roundIntroId++;p.stopCameraAnimation();p.document.getElementById('arenaWorld').style.transform=p.cameraTransformFor(target,scale);p.updateForestParallax()}
function view(which){normalize();const p=page(),d=p.document;if(which!=='fit')refresh(d.getElementById(which==='enemy'?'enemyGroup':'launchPad'),1.35);log('view',which)}
async function resize(width){document.getElementById('scene').style.width=width+'px';await pause(80);normalize();log('width',width)}
async function fullscreen(){const p=page();await p.setGameFullscreen(true);await pause(80);p.fitArenaWorld();log('fullscreen',Boolean(p.document.fullscreenElement))}
function watchHidden(){normalize();const p=page();p.document.addEventListener('visibilitychange',()=>{const result={hidden:p.document.hidden,camera:p.cameraAnimation===null,frame:p.forestParallaxFrameId};log('actual visibility',result);if(result.hidden)localStorage.setItem('forest-parallax-visibility-test',JSON.stringify(result))});p.focusCameraOn(p.document.getElementById('enemyGroup'),1.35,10000);log('watching actual visibility',{})}
async function checkCoverage(){await ready();for(const width of [1440,760,390]){await resize(width);for(const which of ['enemy','launcher','fit']){view(which);const p=page(),d=p.document,a=d.getElementById('arena').getBoundingClientRect(),r=d.querySelector('[data-forest-layer="distant"]').getBoundingClientRect();const bounds={left:r.left-r.width*.4,right:r.right+r.width*.4,top:r.top-r.height*.4,bottom:r.bottom+r.height*.4};assert('opaque backdrop covers '+width+' '+which,bounds.left<=a.left+1&&bounds.right>=a.right-1&&bounds.top<=a.top+1&&bounds.bottom>=a.bottom-1,{bounds,arena:{left:a.left,right:a.right,top:a.top,bottom:a.bottom}})}}await resize(760);view('fit')}
async function runSuite(){if(busy)return;busy=true;checks.length=0;try{await ready();normalize();const p=page(),d=p.document,w=d.getElementById('arenaWorld'),enemy=d.getElementById('enemyGroup'),launcher=d.getElementById('launchPad');
assert('fit identity',identity(),states().layers.map(l=>({name:l.name,a:l.matrix.a,x:l.matrix.e,y:l.matrix.f})));
refresh(enemy,1.35);const st=states(),a=d.getElementById('arena'),f=Math.min(a.clientWidth/w.offsetWidth,a.clientHeight/w.offsetHeight);assert('depth-specific scale',st.layers.every(l=>Math.abs(st.camera.a*l.matrix.a-(f+l.p*(st.camera.a-f)))<0.0001),st.layers.map(l=>({name:l.name,globalScale:st.camera.a*l.matrix.a})));
const motion=p.focusCameraOn(launcher,1.35,500);await pause(120);assert('one active sampler',p.forestParallaxFrameId!==null,p.forestParallaxFrameId);const before=new p.DOMMatrixReadOnly(p.getComputedStyle(w).transform);p.stopCameraAnimation();const after=new p.DOMMatrixReadOnly(p.getComputedStyle(w).transform);await motion;assert('cancel freezes current frame',Math.abs(before.e-after.e)<1&&Math.abs(before.f-after.f)<1,{before:{x:before.e,y:before.f},after:{x:after.e,y:after.f}});assert('cancel releases handles',p.cameraAnimation===null&&p.forestParallaxFrameId===null,{camera:p.cameraAnimation,frame:p.forestParallaxFrameId});
const first=p.focusCameraOn(enemy,1.35,200),second=p.focusCameraOn(launcher,1.35,300);await first;assert('old completion preserves new animation',p.cameraAnimation!==null&&p.forestParallaxFrameId!==null,{});await second;p.fitArenaWorld();assert('finished fit releases handles',p.cameraAnimation===null&&p.forestParallaxFrameId===null&&identity(),{});
p.playRoundIntro();await pause(50);p.showScreen('reward');await pause(1200);assert('battle-to-reward cancels intro',p.cameraAnimation===null&&p.forestParallaxFrameId===null&&d.querySelector('[data-screen="battle"]').hidden,{});normalize();
p.showScreen('battle');p.showScreen('reward');p.showScreen('battle');await pause(400);for(let attempt=0;attempt<60;attempt++){if(p.cameraAnimation===null&&p.forestParallaxFrameId===null&&identity())break;await pause(100)}assert('rapid reentry settles once',p.cameraAnimation===null&&p.forestParallaxFrameId===null&&identity(),{camera:p.cameraAnimation?.playState,frame:p.forestParallaxFrameId,transform:p.getComputedStyle(w).transform,hidden:p.document.hidden});
const areaMotion=p.focusCameraOn(enemy,1.35,400);await pause(80);p.setArenaArea('snow');assert('nonforest clears scenery and sampler',p.forestParallaxFrameId===null&&[...w.querySelectorAll('[data-forest-layer]')].every(l=>l.style.transform===''),{});p.setArenaArea('forest');assert('forest resumes active sampler',p.forestParallaxFrameId!==null,{});await areaMotion;p.fitArenaWorld();
const blurMotion=p.focusCameraOn(enemy,1.35,400);await pause(80);p.dispatchEvent(new p.Event('blur'));await blurMotion;assert('blur releases camera and sampler',p.cameraAnimation===null&&p.forestParallaxFrameId===null,{});p.dispatchEvent(new p.Event('focus'));assert('focus restores fit',identity(),{});
const query=p.forestMotionQuery;p.forestMotionQuery={matches:true};try{await p.playRoundIntro();assert('reduced motion uses static fit',p.cameraAnimation===null&&p.forestParallaxFrameId===null&&identity(),{})}finally{p.forestMotionQuery=query}
assert('path remains on world camera',d.getElementById('forestPath').style.transform==='',{});assert('foreground remains ahead of path',Number(p.getComputedStyle(d.querySelector('.forest-foreground')).zIndex)>Number(p.getComputedStyle(d.getElementById('forestPath')).zIndex),{});log('SUITE COMPLETE',{passed:checks.filter(c=>c.name.startsWith('PASS')).length});
}catch(error){log('ERROR',error.message)}finally{busy=false}}
async function shot(){await ready();normalize();const p=page(),d=p.document,a=d.getElementById('arena'),r=a.getBoundingClientRect(),before=Number(d.getElementById('ammoValue').textContent),x=r.left+r.width*.6,y=r.top+r.height*.6;function pointer(type,cx,cy,buttons){a.dispatchEvent(new p.PointerEvent(type,{bubbles:true,pointerId:321,pointerType:'mouse',button:0,buttons,clientX:cx,clientY:cy}))}pointer('pointerdown',x,y,1);pointer('pointermove',x,y-20,1);d.dispatchEvent(new p.KeyboardEvent('keydown',{bubbles:true,code:'Space',key:' '}));await pause(300);d.dispatchEvent(new p.KeyboardEvent('keyup',{bubbles:true,code:'Space',key:' '}));pointer('pointermove',r.left+r.width*.8,y,1);const trajectory=d.getElementById('trajectoryPath').getAttribute('d');pointer('pointerup',r.left+r.width*.8,y,0);await pause(750);for(let attempt=0;attempt<60&&p.aimState.phase==='launching';attempt++)await pause(100);assert('shot follows existing aiming flow',Boolean(trajectory)&&Number(d.getElementById('ammoValue').textContent)===before-1&&p.aimState.phase==='idle',{before,after:d.getElementById('ammoValue').textContent,trajectory,phase:p.aimState.phase,hidden:p.document.hidden})}
</script></html>
