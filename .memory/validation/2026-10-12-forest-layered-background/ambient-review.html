<!doctype html><html lang="ko"><meta charset="utf-8"><title>Forest ambient final verification</title>
<style>body{margin:0;background:#f5f0e6;font:14px system-ui}nav{padding:8px;display:flex;flex-wrap:wrap;gap:6px}button{padding:8px}pre{max-height:80px;overflow:auto;white-space:pre-wrap}iframe{width:760px;height:900px;border:0;display:block}</style>
<nav><button onclick="suite()">Run ambient checks</button><button onclick="view('fit')">Fit</button><button onclick="view('enemy')">Enemy</button><button onclick="view('launcher')">Launcher</button><button onclick="resize(1440)">1440px</button><button onclick="resize(760)">760px</button><button onclick="resize(390)">390px</button><button onclick="theme('dark')">Dark</button><button onclick="theme('light')">Light</button><button onclick="shots()">Shot checks</button><button onclick="watchExit()">Watch exit</button><button onclick="reducedLoad()">Reduced load</button><button onclick="reduceIntro()">Reduce during intro</button><button onclick="fullscreen()">Fullscreen</button></nav>
<pre id="log">Loading actual mockup page.</pre><iframe id="scene" allowfullscreen src="/cookie-roguelike-mockup.html" onload="loaded()"></iframe>
<script>
const results=[];const wait=ms=>new Promise(r=>setTimeout(r,ms));let busy=false;
function loaded(){const p=page();p.originalSetFullscreen=p.setGameFullscreen;p.setGameFullscreen=async function(){};p.showScreen('battle')}
function page(){return document.getElementById('scene').contentWindow}
function record(name,detail){results.push({name,detail});document.getElementById('log').textContent=JSON.stringify(results,null,2)}
function check(name,ok,detail={}){record((ok?'PASS ':'FAIL ')+name,detail);if(!ok)throw Error(name)}
async function ready(){for(let i=0;i<100;i++){if(page().document.getElementById('arena')?.dataset.forestReady==='true')return;await wait(50)}throw Error('assets not ready')}
function normalize(){const p=page();p.screenNavigationId++;p.roundIntroId++;p.stopCameraAnimation();p.document.querySelectorAll('[data-screen]').forEach(e=>e.hidden=e.dataset.screen!=='battle');p.setArenaArea('forest');p.fitArenaWorld();p.syncForestAmbientState()}
function effects(){const p=page();return [...p.document.querySelectorAll('.forest-fog,.forest-leaf,.forest-waterfall-flow')].map(e=>({class:e.className,state:p.getComputedStyle(e).animationPlayState,transform:p.getComputedStyle(e).transform,position:p.getComputedStyle(e).backgroundPosition,time:e.getAnimations()[0]?.currentTime,visibility:p.getComputedStyle(e).visibility}))}
function paused(){return page().document.getElementById('arena').dataset.forestAmbient==='paused'&&effects().every(e=>e.state==='paused')}
function view(which){normalize();const p=page(),d=p.document;if(which!=='fit'){d.getElementById('arenaWorld').style.transform=p.cameraTransformFor(d.getElementById(which==='enemy'?'enemyGroup':'launchPad'),1.35);p.updateForestParallax()}record('view',which)}
async function resize(width){document.getElementById('scene').style.width=width+'px';document.getElementById('scene').style.height=(width===390?844:900)+'px';await wait(100);normalize();record('width',width)}
function theme(value){page().applyTheme(value);record('theme',value)}
async function fullscreen(){const p=page();await p.originalSetFullscreen(true);await wait(100);p.fitArenaWorld();record('fullscreen entry',{active:Boolean(p.document.fullscreenElement),ambient:p.document.getElementById('arena').dataset.forestAmbient});await wait(1000);await p.originalSetFullscreen(false);await wait(100);p.fitArenaWorld();record('fullscreen exit',{active:Boolean(p.document.fullscreenElement),ambient:p.document.getElementById('arena').dataset.forestAmbient})}
async function suite(){if(busy)return;busy=true;results.length=0;try{await ready();normalize();const p=page(),d=p.document,a=d.getElementById('arena'),q=p.forestMotionQuery;
check('nine fixed effects',effects().length===9,{count:effects().length});check('visible forest running',a.dataset.forestAmbient==='running'&&effects().every(e=>e.state==='running'),effects());
const first=effects();await wait(450);const second=effects();check('fog leaf and water advance',second[0].transform!==first[0].transform&&second[2].position!==first[2].position&&second[3].transform!==first[3].transform,{first,second});
for(const area of ['snow','city','chaos']){p.setArenaArea(area);check(area+' pauses and hides forest',paused()&&p.getComputedStyle(d.getElementById('forestScenery')).display==='none',{})}p.setArenaArea('forest');check('forest resumes',a.dataset.forestAmbient==='running',{});
p.showScreen('reward');check('battle exit pauses',paused(),{});normalize();check('battle reentry resumes',a.dataset.forestAmbient==='running',{});
Object.defineProperty(d,'hidden',{configurable:true,get:()=>true});d.dispatchEvent(new p.Event('visibilitychange'));check('hidden pauses animation',paused(),{});const frozen=effects().map(e=>e.time);await wait(200);check('paused animation times stay fixed',effects().every((e,i)=>e.time===frozen[i]),{frozen,after:effects().map(e=>e.time)});delete d.hidden;d.dispatchEvent(new p.Event('visibilitychange'));check('visible resumes',a.dataset.forestAmbient==='running',{});
p.forestMotionQuery={matches:true};q.dispatchEvent(new p.MediaQueryListEvent('change',{matches:true}));check('reduce pauses effects and hides leaves',paused()&&effects().filter(e=>e.class==='forest-leaf').every(e=>e.visibility==='hidden')&&p.cameraAnimation===null&&p.forestParallaxFrameId===null,{});p.forestMotionQuery=q;q.dispatchEvent(new p.MediaQueryListEvent('change',{matches:false}));check('normal motion resumes without intro',a.dataset.forestAmbient==='running'&&p.cameraAnimation===null,{});
for(const width of [1440,760,390]){await resize(width);for(const which of ['enemy','launcher','fit']){view(which);const r=d.querySelector('[data-forest-layer="distant"]').getBoundingClientRect(),ar=a.getBoundingClientRect();check('backdrop covers '+width+' '+which,r.left-r.width*.4<=ar.left+1&&r.right+r.width*.4>=ar.right-1&&r.top-r.height*.4<=ar.top+1&&r.bottom+r.height*.4>=ar.bottom-1,{});check('ambient independent of camera '+width+' '+which,a.dataset.forestAmbient==='running'&&effects().every(e=>e.state==='running'),{})}}
await resize(760);for(const mode of ['dark','light']){theme(mode);check(mode+' retains running scene',d.documentElement.classList.contains('theme-'+mode)&&a.dataset.forestAmbient==='running',{})}record('SUITE COMPLETE',{passed:results.filter(e=>e.name.startsWith('PASS')).length});
}catch(e){record('ERROR',e.message)}finally{busy=false}}
async function shots(){if(busy)return;busy=true;await ready();normalize();const p=page(),d=p.document,a=d.getElementById('arena');const pointer=(type,x,y,buttons)=>a.dispatchEvent(new p.PointerEvent(type,{bubbles:true,pointerId:321,pointerType:'mouse',button:0,buttons,clientX:x,clientY:y}));
async function attempt(kind){normalize();const r=a.getBoundingClientRect(),x=r.left+r.width*.55,y=r.top+r.height*.62,before=Number(d.getElementById('ammoValue').textContent);pointer('pointerdown',x,y,1);if(kind!=='early'){pointer('pointermove',x,y-20,1);d.dispatchEvent(new p.KeyboardEvent('keydown',{bubbles:true,code:'Space',key:' '}));await wait(350);d.dispatchEvent(new p.KeyboardEvent('keyup',{bubbles:true,code:'Space',key:' '}));pointer('pointermove',r.left+r.width*.82,y,1)}pointer('pointerup',r.left+r.width*.82,y,0);if(kind==='leave')p.showScreen('reward');for(let i=0;i<80&&p.aimState.phase==='launching';i++)await wait(100);const after=Number(d.getElementById('ammoValue').textContent);check(kind+' shot',after===before-(kind==='complete'?1:0)&&p.aimState.phase==='idle'&&(kind!=='leave'||paused()),{before,after,phase:p.aimState.phase})}
try{for(const kind of ['early','complete','leave'])await attempt(kind);normalize();record('SHOTS COMPLETE',{})}catch(e){record('ERROR',e.message)}finally{busy=false}}
function watchExit(){normalize();const p=page();p.document.addEventListener('visibilitychange',()=>{if(p.document.hidden)localStorage.setItem('forest-ambient-exit',JSON.stringify({hidden:true,state:p.document.getElementById('arena').dataset.forestAmbient,effects:effects().map(e=>e.state),frame:p.forestParallaxFrameId}))});record('watching actual exit',{})}
async function reduceIntro(){normalize();const p=page(),q=p.forestMotionQuery;p.playRoundIntro();await wait(100);p.forestMotionQuery={matches:true};q.dispatchEvent(new p.MediaQueryListEvent('change',{matches:true}));check('reduce during intro pauses camera and effects',paused()&&p.cameraAnimation===null&&p.forestParallaxFrameId===null,{});await wait(1100);check('cancelled intro stays stopped',paused()&&p.cameraAnimation===null&&p.forestParallaxFrameId===null,{});p.forestMotionQuery=q;q.dispatchEvent(new p.MediaQueryListEvent('change',{matches:false}));check('restore motion only resumes ambient',p.document.getElementById('arena').dataset.forestAmbient==='running'&&p.cameraAnimation===null,{})}
async function reducedLoad(){const h=await (await fetch('/cookie-roguelike-mockup.html')).text();document.getElementById('scene').srcdoc=h.replace('<head>','<head><base href="/"><script>const savedMatchMedia=window.matchMedia.bind(window);window.matchMedia=function(q){const m=savedMatchMedia(q);if(q===\'(prefers-reduced-motion: reduce)\')Object.defineProperty(m,\'matches\',{get:()=>true});return m};<'+ '/script>');await wait(300);await ready();await wait(100);const p=page();check('reduced before load is static',paused()&&p.cameraAnimation===null&&p.forestParallaxFrameId===null,{state:p.document.getElementById('arena').dataset.forestAmbient})}
</script></html>
