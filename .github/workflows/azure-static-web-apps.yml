name: Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-static-web-apps-production
  cancel-in-progress: false

jobs:
  verify:
    name: Test and build release artifact
    runs-on: ubuntu-latest
    env:
      ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
      AZURE_DEPLOY_ENABLED: ${{ vars.AZURE_DEPLOY_ENABLED }}
      VITE_ENABLE_BGM: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit and API tests
        run: npm test

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chrome

      - name: Run production browser tests
        run: npm run test:e2e

      - name: Run map studio tests
        run: npm run test:studio

      - name: Require tenant configuration before enabling deployment
        if: env.AZURE_DEPLOY_ENABLED == 'true' && env.ENTRA_TENANT_ID == ''
        run: |
          echo 'Set the ENTRA_TENANT_ID repository variable before enabling Azure deployment.'
          exit 1

      - name: Build tenant-restricted Azure artifact
        if: env.ENTRA_TENANT_ID != ''
        run: npm run build:azure

      - name: Build local-safe artifact when Azure is not configured
        if: env.ENTRA_TENANT_ID == ''
        run: npm run build

      - name: Upload tested static artifact
        uses: actions/upload-artifact@v4
        with:
          name: swa-static-site
          path: dist/
          if-no-files-found: error

      - name: Keep browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 1

  deploy:
    name: Deploy to Azure Static Web Apps
    needs: verify
    if: github.ref == 'refs/heads/main' && vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out API source
        uses: actions/checkout@v4

      - name: Download tested static artifact
        uses: actions/download-artifact@v4
        with:
          name: swa-static-site
          path: dist

      - name: Require deployment token without printing it
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN || secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_FLOWER_0764F6D00 }}
        run: |
          if [ -z "$SWA_TOKEN" ]; then
            echo 'Set AZURE_STATIC_WEB_APPS_API_TOKEN or the existing Azure portal deployment secret before enabling Azure deployment.'
            exit 1
          fi

      - name: Deploy static site and managed API
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN || secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_FLOWER_0764F6D00 }}
          action: upload
          app_location: dist
          api_location: api
          output_location: ''
          skip_app_build: true
          skip_api_build: false
